[project]
name = "wafer-probe-web"
version = "0.2.0"
description = "Wafer-probe measurements (S200 + B1500A / 4200A) with a web app to plan, run and browse them"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "scipy>=1.16",
    "matplotlib>=3.10",
    "pyvisa>=1.15",
    "pymeasure>=0.15",
    "fastapi>=0.120",
    "pydantic>=2.11",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.14",
]

[tool.uv]
package = false
