# The web app and its tests follow ruff's defaults plus these rules; src/measure keeps its own long-standing style.
line-length = 120
target-version = "py314"
extend-exclude = ["src/measure"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "S", "N"]
ignore = ["S101", "S311"]

[lint.per-file-ignores]
"tests/*" = ["S", "B017", "N802"]

[lint.isort]
known-first-party = ["app", "measure"]

[format]
quote-style = "double"
